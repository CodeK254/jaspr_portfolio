name: Deploy Jaspr portfolio

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      - run: dart run jaspr_cli:jaspr build --dart-define=BASE_PATH=/jaspr_portfolio/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/jaspr
      - id: deployment
        uses: actions/deploy-pages@v4
